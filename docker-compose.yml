version: "3.8"

services:
  postgres:
    container_name: nest-clean-pg
    image: bitnami/postgresql:latest
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=nest-clean
    volumes:
      - postgres_data:/bitnami/postgresql

  cache:
    container_name: nest-clean-cache
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
